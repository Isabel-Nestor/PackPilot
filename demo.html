<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   PackPilot | Sales workspace demo
  </title>
  <meta content="#071425" name="theme-color"/>
  <style>
   :root {
  color-scheme:dark;
  --bg:#071425;
  --panel:#0d2137;
  --panel2:#102b45;
  --line:#24405a;
  --txt:#eef7ff;
  --muted:#9cb4c9;
  --teal:#20d1ce;
  --red:#ff6f80;
  --amber:#ffcb72;
  --blue:#72baff;
  --green:#58dbac;
  --shadow:0 14px 42px #0003
}
* {
  box-sizing:border-box
}
html {
  scroll-behavior:smooth
}
body {
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font:14px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif
}
button,input,select,textarea {
  font:inherit
}
button,a {
  transition:background .18s,border-color .18s,transform .18s
}
button {
  cursor:pointer
}
button:disabled {
  opacity:.46;
  cursor:not-allowed
}
a {
  color:inherit;
  text-decoration:none
}
a:hover,button:hover:not(:disabled) {
  filter:brightness(1.12)
}
:focus-visible {
  outline:3px solid var(--teal);
  outline-offset:3px
}
.muted {
  color:var(--muted)
}
.small {
  font-size:12px
}
.eyebrow {
  color:var(--teal);
  font-size:11px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase
}
.brand {
  font-size:21px;
  font-weight:850;
  letter-spacing:-.8px;
  white-space:nowrap
}
.brand b {
  color:var(--teal)
}
.mark {
  display:inline-grid;
  place-items:center;
  background:var(--teal);
  color:#082234;
  width:34px;
  height:34px;
  border-radius:10px;
  margin-right:9px
}
.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--shadow)
}
.btn {
  border:1px solid var(--line);
  background:#15334d;
  color:var(--txt);
  padding:10px 14px;
  border-radius:10px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  white-space:nowrap
}
.btn.primary {
  background:var(--teal);
  border-color:var(--teal);
  color:#05232e
}
.btn.ghost {
  background:transparent
}
.btn.danger {
  color:var(--red)
}
.btn.tiny {
  padding:6px 9px;
  font-size:12px
}
.pill {
  display:inline-block;
  border:1px solid;
  border-radius:999px;
  padding:3px 9px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}
.pill.red {
  color:var(--red);
  background:#ff6f8019;
  border-color:#ff6f8055
}
.pill.amber {
  color:var(--amber);
  background:#ffcb7216;
  border-color:#ffcb7255
}
.pill.blue {
  color:var(--blue);
  background:#72baff14;
  border-color:#72baff55
}
.pill.green {
  color:var(--green);
  background:#58dbac16;
  border-color:#58dbac55
}
.pill.neutral {
  color:#bfd1e0;
  border-color:#637d9255
}
.row {
  display:flex;
  align-items:center;
  gap:10px
}
.between {
  justify-content:space-between
}
.wrap {
  flex-wrap:wrap
}
.stack {
  display:grid;
  gap:14px
}
.grid {
  display:grid;
  gap:14px
}
.g2 {
  grid-template-columns:repeat(2,minmax(0,1fr))
}
.g3 {
  grid-template-columns:repeat(3,minmax(0,1fr))
}
.g4 {
  grid-template-columns:repeat(4,minmax(0,1fr))
}
h1,h2,h3,p {
  margin-top:0
}
h1 {
  font-size:clamp(30px,3.4vw,46px);
  letter-spacing:-1.5px;
  line-height:1.13
}
h2 {
  font-size:clamp(23px,2.5vw,32px);
  letter-spacing:-.8px;
  line-height:1.2
}
h3 {
  font-size:16px
}
p {
  color:var(--muted)
}
.field {
  background:#0a1b2d;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--txt);
  padding:10px 12px;
  min-width:0;
  width:100%
}
textarea.field {
  min-height:90px;
  resize:vertical
}
label {
  font-size:12px;
  font-weight:700;
  color:#c4d5e3
}
hr {
  border:0;
  border-top:1px solid var(--line);
  margin:15px 0
}
.tablewrap {
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px
}
table {
  border-collapse:collapse;
  width:100%;
  min-width:750px
}
th,td {
  text-align:left;
  padding:13px 12px;
  border-bottom:1px solid #24405a88;
  vertical-align:middle
}
th {
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--muted);
  background:#10283e;
  cursor:pointer
}
tr:last-child td {
  border-bottom:0
}
tbody tr:hover {
  background:#18334a66
}
.metric {
  padding:18px
}
.metric .num {
  font-size:27px;
  font-weight:850;
  letter-spacing:-1px;
  margin-top:4px
}
.metric .caption {
  color:var(--muted);
  font-size:12px
}
.metric .ico {
  color:var(--teal);
  font-size:20px
}
.alert {
  border:1px solid var(--line);
  border-left:4px solid var(--amber);
  border-radius:12px;
  padding:13px;
  background:#10263b
}
.alert.red {
  border-left-color:var(--red)
}
.alert.blue {
  border-left-color:var(--blue)
}
.alert.green {
  border-left-color:var(--green)
}
.alert .meta {
  color:var(--muted);
  font-size:12px
}
.hidden {
  display:none!important
}
.empty {
  text-align:center;
  padding:28px;
  color:var(--muted)
}
.toast {
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:1000;
  background:#123f43;
  border:1px solid var(--teal);
  padding:13px 18px;
  border-radius:12px;
  box-shadow:var(--shadow);
  max-width:350px
}
.modalbg {
  position:fixed;
  inset:0;
  background:#000a;
  z-index:100;
  display:grid;
  place-items:center;
  padding:15px
}
.modal {
  background:#10243a;
  border:1px solid #3c5a72;
  border-radius:18px;
  padding:22px;
  width:min(600px,100%);
  max-height:92vh;
  overflow:auto
}
.modal h2 {
  font-size:23px
}
.divider {
  height:1px;
  background:var(--line);
  margin:16px 0
}
.skeleton {
  height:13px;
  border-radius:7px;
  background:linear-gradient(90deg,#19344a,#28475d,#19344a);
  background-size:200% 100%;
  animation:shimmer 1.3s linear infinite
}
@keyframes shimmer {
  to {
    background-position:-200% 0
  }
  
}
@media(max-width:900px) {
  .g4 {
    grid-template-columns:repeat(2,1fr)
  }
  .g3 {
    grid-template-columns:repeat(2,1fr)
  }
  
}
@media(max-width:600px) {
  .g2,.g3,.g4 {
    grid-template-columns:1fr
  }
  .card {
    padding:15px
  }
  h1 {
    font-size:31px
  }
  
}
@media(prefers-reduced-motion:reduce) {
  *,*:before,*:after {
    animation:none!important;
    scroll-behavior:auto!important;
    transition:none!important
  }
  
}
  </style>
  <style>
   .app {
  display:grid;
  grid-template-columns:235px minmax(0,1fr);
  min-height:100vh
}
.side {
  background:#09192a;
  border-right:1px solid var(--line);
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto
}
.navbtn {
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#b6ccdf;
  padding:12px 13px;
  border-radius:10px;
  margin:3px 0;
  font-weight:650
}
.navbtn.active,.navbtn:hover {
  background:#12384b;
  color:var(--teal)
}
.main {
  min-width:0;
  padding:22px clamp(14px,3vw,36px) 50px
}
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:25px
}
.toptools {
  display:flex;
  gap:8px;
  align-items:center
}
.mobilemenu {
  display:none
}
.section {
  display:none
}
.section.active {
  display:block
}
.sectionhead {
  margin-bottom:22px
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:7px
}
.toolbar {
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:13px
}
.toolbar .field {
  width:auto;
  min-width:140px;
  flex:1
}
.tabs {
  display:flex;
  gap:6px;
  flex-wrap:wrap
}
.tab {
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:8px;
  padding:8px 11px
}
.tab.active {
  background:var(--teal);
  color:#062633;
  border-color:var(--teal)
}
.progress {
  display:flex;
  gap:4px;
  margin:12px 0
}
.progress span {
  height:7px;
  flex:1;
  background:#244157;
  border-radius:4px
}
.progress span.done {
  background:var(--green)
}
.progress span.current {
  background:var(--teal)
}
.timeline {
  position:relative;
  display:grid;
  gap:9px
}
.step {
  display:flex;
  gap:12px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  background:#10263a
}
.stepicon {
  flex:0 0 34px;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#1d4356;
  color:var(--teal)
}
.step.done .stepicon {
  background:#154e48;
  color:var(--green)
}
.step.waiting .stepicon {
  background:#573a35;
  color:var(--amber)
}
.step.upcoming {
  opacity:.65
}
.miniimage {
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#28536a,#17324a);
  border-radius:10px;
  font-size:24px
}
.detailgrid {
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:15px
}
.drawer {
  position:fixed;
  inset:0 0 0 auto;
  width:min(650px,100%);
  z-index:80;
  background:#0b1c2e;
  border-left:1px solid var(--line);
  padding:22px;
  overflow:auto;
  box-shadow:-15px 0 50px #0008
}
.bell {
  position:relative
}
.count {
  position:absolute;
  right:-5px;
  top:-7px;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  min-width:19px;
  text-align:center;
  font-size:11px;
  padding:1px 4px
}
.mobileonly {
  display:none
}
@media(max-width:1000px) {
  .detailgrid {
    grid-template-columns:1fr
  }
  
}
@media(max-width:760px) {
  .app {
    display:block
  }
  .side {
    position:fixed;
    z-index:90;
    left:0;
    top:0;
    width:240px;
    transform:translateX(-105%);
    transition:transform .2s;
    box-shadow:var(--shadow)
  }
  .side.open {
    transform:none
  }
  .mobilemenu,.mobileonly {
    display:inline-flex
  }
  .main {
    padding-top:14px
  }
  .toptools .smallhide {
    display:none
  }
  
}
@media(max-width:600px) {
  .top {
    align-items:flex-start
  }
  .toptools {
    flex-wrap:wrap;
    justify-content:flex-end
  }
  .toolbar .field {
    width:100%;
    flex-basis:100%
  }
  
}
  </style>
  <style id="callback-styles">

}
.callback-hero h3 {
  margin:5px 0 7px
}
.callback-hero .row {
  gap:12px
}
.callback-status {
  display:inline-flex;

  color:#86f0dd;
  font-size:12px;
  font-weight:700
}
.callback-status.scheduled {
  background:#233956;
  color:#9cc7ff
}
.callback-status.completed {
  background:#153d35;
  color:#8df1c0
}
.cb-list {
  display:grid;
  gap:12px
}
.cb-item {

  </style>
  <style id="journey-v2">
   .journey-track {
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:9px;
  position:relative;
  margin:18px 0 22px
}
.journey-track:before {
  content:"";
  position:absolute;
  top:25px;
  left:5%;
  right:5%;
  height:2px;
  background:linear-gradient(90deg,#22c9bb,#31536a);
  z-index:0
}
.journey-node {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:8px;
  min-width:0;
  padding:10px 5px;
  border-radius:13px;
  background:#10293e;
  border:1px solid #28445a;
  font-size:11px
}
.journey-node strong {
  font-size:11px;
  min-height:27px
}
.journey-node .small {
  font-size:10px;
  overflow-wrap:anywhere
}
.journey-icon {
  width:49px;
  height:49px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:#15384b;
  color:#4bd5ce;
  border:1px solid #37657a
}
.journey-node.done .journey-icon {
  color:#67e5b5;
  border-color:#238e73;
  background:#13463f
}
.journey-node.waiting .journey-icon {
  color:#ffb6a9;
  border-color:#a85252;
  background:#4b2935
}
.journey-node.upcoming {
  opacity:.74
}
.journey-node.done:last-child .journey-icon {
  background:#176b50;
  color:white
}
.action-needed {
  font-weight:700;
  color:#ffb6a9
}
.previous-item {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;

}
.previous-item:last-child {
  border-bottom:0
}
.previous-item .btn {
  white-space:normal
}
@media(max-width:1150px) {
  .journey-track {
    grid-template-columns:repeat(4,minmax(0,1fr))
  }
  .journey-track:before {
    display:none
  }
  
}
@media(max-width:600px) {
  .journey-track {
    grid-template-columns:1fr;
    gap:8px
  }
  .journey-node {
    display:grid;
    grid-template-columns:48px minmax(0,1fr) auto;
    text-align:left;
    align-items:center;
    padding:12px;
    gap:4px 12px
  }
  .journey-node .journey-icon {
    grid-row:span 4
  }
  .journey-node strong {
    min-height:0
  }
  .journey-node .small,.journey-node .action-needed {
    grid-column:2/-1
  }
  .previous-item {
    align-items:flex-start;
    flex-direction:column
  }
  
}
@media(prefers-reduced-motion:no-preference) {
  .journey-node,.journey-icon {
    transition:background .2s,border-color .2s,transform .2s
  }
  .journey-node:hover {
    transform:translateY(-2px)
  }
  
}
  </style>
  <style>
   .dashboard-focus>.card {
  order:-1
}

/* PackPilot focused experience: comfortable reading, mobile cards, consistent controls */

  max-width:100%;
  overflow-x:clip
}
.app,.main,.section,.card,.detailgrid,.stack {
  min-width:0;
  max-width:100%
}

.btn,.navbtn {
  min-height:40px
}
.btn:focus-visible,.navbtn:focus-visible {
  outline:2px solid var(--teal);
  outline-offset:3px
}

.card {
  box-shadow:0 10px 30px #0002
}
.metric .num {
  font-variant-numeric:tabular-nums
}

.sectionhead {
  max-width:780px
}
.sectionhead .muted {
  max-width:650px
}

@media(max-width:680px) {
  
 .tablewrap {
    border:0;
    overflow:visible!important;
    background:transparent
  }
  
 .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td {
    display:block;
    width:100%;
    min-width:0!important
  }
  
 .tablewrap thead {
    display:none
  }
  
 .tablewrap tbody {
    display:grid;
    gap:12px
  }
  
 .tablewrap tr {
    border:1px solid var(--line);
    border-radius:14px;
    background:#10263b;

    overflow:hidden
  }
  
 .tablewrap td {
    border:0;
    padding:5px 0;
    overflow-wrap:anywhere
  }
  
 .tablewrap td:nth-child(2) {

  }
  
 .tablewrap td:nth-child(4):before {

  }
  
 .tablewrap td:nth-child(5):before {

    color:var(--muted);

  }
  
 .tablewrap td:last-child {

  }
  
 .tablewrap td:last-child .actions {

  }
  
 .top {

 .main {

  }
  .metric {
    padding:14px
  }
  
 .detailgrid {
    display:grid;
    grid-template-columns:1fr
  }
  

}

@media(prefers-reduced-motion:reduce) {
  .skeleton {
    animation:none
  }
  
}
  </style>
  <style id="packpilot-interaction-polish">
   /* Small, purposeful movement: tiles lift and buttons respond to touch. */
@media (hover:hover) and (prefers-reduced-motion:no-preference) {
  
.card,.alert,.cb-item,.journey-node,.metric,.previous-item,.journeystep {
    
 transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,box-shadow .22s,background .22s;
    

  }
  
.card:hover,.cb-item:hover,.journey-node:hover,.metric:hover {
    
 transform:translateY(-4px);
    
 border-color:#3e7589;
    
 box-shadow:0 18px 42px #0005;
    

  }
  
.alert:hover,.previous-item:hover {
    transform:translateY(-2px);
    border-color:#3e7589
  }
  
.btn:hover:not(:disabled),.navbtn:hover:not(:disabled) {
    transform:translateY(-2px)
  }
  

}

.btn:active:not(:disabled),.navbtn:active:not(:disabled) {
  transform:scale(.965)

  }
  
}

 display:flex;

 background:#10372f;

 box-shadow:0 18px 52px #0009;

 animation:ppToastIn .28s cubic-bezier(.2,.8,.2,1) both;
  

}

.pp-feedback-icon {
  width:34px;

  border-radius:50%;
  flex:none;

 background:#1c765c;

unction setting(k,v){let c;try{c=JSON.parse(localStorage.getItem('pp_settings'))||{}}catch{c={}}c[k]=v;localStorage.setItem('pp_settings',JSON.stringify(c));toast('Demo preference saved')}function help(){return head('Quick guide','A two-minute tour of the PackPilot concept.')+`<div class="grid g2"><div class="card"><h3>1. Start with Needs attention</h3><p>Red and amber alerts are generated from missing documents, dates, payment balances and shipment delays.</p></div><div class="card"><h3>2. Open any order</h3><p>Review the 10-stage journey, documents, payment breakdown, activity history and notes.</p></div><div class="card"><h3>3. Try a nudge</h3><p>Preview and edit a message, then send a simulated reminder. It is logged and locked for 24 hours.</p></div><div class="card"><h3>4. Preview the customer portal</h3><p>Choose a customer to see only their orders, actions, shipping route and documents.</p></div></div><div class="card" style="margin-top:15px"><h3>What is real in this prototype?</h3><p>Working locally: filtering, sorting, alerts, stage updates, notes, demo nudges, local persistence, customer preview, CSV export and sample document downloads. Planned: real customer accounts, secure permissions, live email/SMS, payment processing, external carrier tracking and real file storage. No actual data is transmitted.</p></div>`}function callbackBanner(o){let c=activeCB(o.customer);let last=cbFor(o.customer)[0];return `<div class="callback-hero"><div class="row between wrap"><div><div class="eyebrow">Your packaging team is one call away</div><h3>Interested in new branded items? Let's talk.</h3><p class="small muted" style="margin:0">Ask ${esc(repName(o))} about new packaging, artwork or a quote.</p></div><button class="btn primary" onclick="requestCallback()" ${c?'disabled':''}>☎ ${c?'Call back already requested':'Request a call back'}</button></div>${last?`<div style="margin-top:13px"><span class="callback-status ${last.status.toLowerCase()}">☎ ${esc(last.status)}</span><span class="small muted" style="margin-left:9px">${last.status==='Requested'?'We have your request.':last.status==='Scheduled'?'Your rep has marked it scheduled.':'Your last request is complete.'}</span></div>`:''}</div>`}
function requestCallback(){const o=get(selected)||orders.find(x=>x.customer===customer)||orders[0];const company=role==='customer'?customer:o.customer;const existing=activeCB(company);if(existing){toast('Call back already requested — '+existing.status.toLowerCase());return}const rep=orders.find(x=>x.customer===company)?.rep||'your sales rep';document.getElementById('overlay').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeOverlay()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cbtitle"><div class="row between"><div><div class="eyebrow">Sample customer request</div><h2 id="cbtitle" style="margin:5px 0">Request a call back</h2></div><button class="btn tiny" onclick="closeOverlay()" aria-label="Close">✕</button></div><p class="small muted">Interested in new branded items? Let's talk. ${esc(rep)} will see this in their sales workspace. No real message is sent.</p><form id="callbackform" class="cb-form" onsubmit="submitCallback(event)"><label>Name<input class="field" name="name" required maxlength="90" value="${esc(orders.find(x=>x.customer===company)?.contact||'')}"></label><label>Company<input class="field" name="company" required readonly value="${esc(company)}"></label><label>Phone number<input class="field" name="phone" type="tel" required placeholder="e.g. 087 123 4567" value="${esc(orders.find(x=>x.customer===company)?.phone||'087 000 0000')}"></label><label>Topic<select class="field" name="topic"><option>New branded packaging</option><option>New product or size</option><option>Change to existing artwork</option><option>Pricing or quote</option><option>Other</option></select></label><label>Preferred time<select class="field" name="time"><option>Morning</option><option>Afternoon</option><option>Anytime</option></select></label><label>Preferred day (optional)<input class="field" type="date" name="day" min="${new Date().toISOString().slice(0,10)}"></label><label class="wide">Preferred contact method<select class="field" name="method"><option value="phone">Phone</option><option value="email">Email</option><option value="video">Video call</option></select></label><label class="wide">Notes (optional)<textarea class="field" name="notes" rows="3" maxlength="500" placeholder="Anything you'd like us to know?"></textarea></label><div class="wide actions" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeOverlay()">Cancel</button><button type="submit" class="btn primary">Send request</button></div></form></div></div>`;modalClose=closeOverlay;document.querySelector('#callbackform input').focus()}
function submitCallback(e){e.preventDefault();const f=e.target;const v=Object.fromEntries(new FormData(f));const o=orders.find(x=>x.customer===v.company);if(!o)return toast('Sample customer not found');if(activeCB(v.company))return toast('Call back already requested');const c={id:'CB-'+Date.now(),customer:v.company,orderId:o.id,name:v.name.trim(),phone:v.phone.trim(),topic:v.topic,time:v.time,day:v.day,method:v.method,notes:v.notes.trim(),rep:o.rep,status:'Requested',created:new Date().toISOString(),updated:new Date().toISOString()};if(!c.name||!c.phone)return toast('Please enter your name and phone number');callbacks.push(c);cbSave();log(o,'Call back requested: '+c.topic+' · '+c.time+(c.notes?' · '+c.notes:''));document.getElementById('overlay').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cbthanks"><div class="eyebrow">Request received · Demo</div><h2 id="cbthanks">Thanks, ${esc(c.name)}!</h2><p>${esc(c.rep)} will follow up within <strong>one working day</strong> (illustrative service target).</p><p class="small muted">Status: Requested → Scheduled → Completed. This request is stored only in your browser and no call has been booked automatically.</p><button class="btn primary" onclick="closeOverlay();render()">Back to my orders</button></div></div>`;modalClose=closeOverlay;render();document.querySelector('#cbthanks').focus?.()}
function callbacksView(){let active=callbacks.filter(c=>c.status!=='Completed');return head('Call backs','High-priority customer requests. Demo requests are stored locally in this browser.')+`<div class="grid g3" style="margin-bottom:15px">${metric('New requests',callbacks.filter(c=>c.status==='Requested').length,'Awaiting a response','☎')}${metric('Scheduled',callbacks.filter(c=>c.status==='Scheduled').length,'Ready for follow-up','◷')}${metric('Completed',callbacks.filter(c=>c.status==='Completed').length,'Recorded in activity history','✓')}</div><div class="cb-list">${[...active,...callbacks.filter(c=>c.status==='Completed')].map(c=>`<div class="cb-item"><div class="row between wrap"><div><span class="pill ${c.status==='Requested'?'red':c.status==='Scheduled'?'blue':'green'}">${esc(c.status)}</span> <span class="small muted">${esc(c.orderId)} · ${new Date(c.created).toLocaleString('en-IE')}</span><h3 style="margin:9px 0 5px">${esc(c.customer)} · ${esc(c.name)}</h3><div class="small">${esc(c.topic)} · ${esc(c.time)}${c.day?' · '+esc(new Date(c.day+'T12:00:00').toLocaleDateString('en-IE')):''} · ${esc(c.method)}</div>${c.notes?`<p class="small muted">${esc(c.notes)}</p>`:''}</div><div class="callback-status ${c.status.toLowerCase()}">${esc(c.status)}</div></div><div class="actions"><button class="btn tiny" onclick="callCustomer('${c.id}')">☎ Call</button><button class="btn tiny" onclick="callbackStatus('${c.id}','Scheduled')" ${c.status!=='Requested'?'disabled':''}>Mark as scheduled</button><button class="btn tiny" onclick="callbackStatus('${c.id}','Completed')" ${c.status==='Completed'?'disabled':''}>Mark as done</button><button class="btn primary tiny" onclick="callbackQuote('${c.id}')">＋ Create a quote</button></div></div>`).join('')||'<div class="card empty">No call back requests yet. Switch to Customer preview to try the workflow.</div>'}</div>`}
function callbackStatus(id,status){const c=callbacks.find(x=>x.id===id);if(!c||c.status==='Completed')return;c.status=status;c.updated=new Date().toISOString();cbSave();const o=get(c.orderId);if(o)log(o,'Call back '+status.toLowerCase()+' for '+c.customer);render();toast('Call back marked '+status.toLowerCase())}
function callCustomer(id){const c=callbacks.find(x=>x.id===id);if(!c)return;document.getElementById('overlay').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeOverlay()"><div class="modal" role="dialog" aria-modal="true"><h2>Call ${esc(c.name)}</h2><p>${esc(c.customer)} · ${esc(c.phone)}</p><p class="small muted">This is a demo. You can copy the number, but PackPilot does not place a real call.</p><div class="actions"><button class="btn primary" onclick="navigator.clipboard?.writeText('${c.phone.replace(/[^+0-9 ]/g,'')}');toast('Phone number copied')">Copy phone number</button><button class="btn" onclick="closeOverlay()">Close</button></div></div></div>`;modalClose=closeOverlay}
function callbackQuote(id){const c=callbacks.find(x=>x.id===id);if(!c)return;const o=get(c.orderId);if(o)log(o,'New quotation follow-up started from call back ('+c.topic+')');render();toast('Quote follow-up logged (demo) — no actual quote created')}
function render(){document.getElementById('role').value=role;document.getElementById('bellcount').textContent=alerts().length+cbCount();nav();document.getElementById('views').innerHTML=({dashboard,orders:orderView,attention,callbacks:callbacksView,customer:customerView,payments:paymentView,settings,help}[view]||dashboard)()}render();
  </script>
 </body>
